name: build

on:
  push:
    # 发布分支由本 workflow 自己推送，忽略它，避免每次部署都触发一轮多余的构建。
    branches-ignore:
      - gh-pages
  pull_request:
    branches: ['*']

# 部署需要写入 gh-pages 分支，prettier 自动修复需要开 PR。
# 显式收窄权限，不再依赖仓库默认的 workflow 权限。
permissions:
  contents: write
  pull-requests: write

# 同一分支上后一次推送取消前一次仍在跑的构建；master 的部署不允许被取消，
# 否则可能在推送 gh-pages 的过程中被打断。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LSI: 'true'
      WECHAT_WORK_BOT_WEBHOOK: ${{ secrets.WECHAT_WEBHOOK_URL }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.0'
    - uses: actions/setup-node@v4
      with:
        node-version: 16

    - name: Install GSL library
      run: sudo apt-get update && sudo apt-get install -y libgsl-dev

    - name: Cache Ruby gems
      uses: actions/cache@v4
      env:
        # 依赖缓存键：改动 Gemfile 或缓存策略时递增，避免复用旧缓存。
        CACHE_ID: 2
      with:
        path: |
          Gemfile.lock
          vendor/bundle
        key: ${{ runner.os }}-bundler-${{ env.CACHE_ID }}-${{ hashFiles('Gemfile') }}
        restore-keys: |
          ${{ runner.os }}-bundler-${{ env.CACHE_ID }}-
    - name: Cache Node modules
      uses: actions/cache@v4
      env:
        CACHE_ID: 2
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-${{ env.CACHE_ID }}-${{ hashFiles('package.json') }}
        restore-keys: |
          ${{ runner.os }}-npm-${{ env.CACHE_ID }}-

    - name: Install dependencies
      run: |
        bundle config set --local path vendor/bundle
        bundle install --jobs=4 --retry=3
        bundle clean
        npm install --include=dev

    - name: Prettier check
      id: prettier
      run: npm run check
    - name: Prettier fix
      if: "failure() && steps.prettier.outcome == 'failure' && github.event_name == 'push' && github.ref == 'refs/heads/master'"
      run: npm run fix
    - name: Submit PR for prettier fix
      if: "failure() && steps.prettier.outcome == 'failure' && github.event_name == 'push' && github.ref == 'refs/heads/master'"
      uses: peter-evans/create-pull-request@v6
      with:
        commit-message: 'Prettier auto fix from GitHub Actions run ${{ github.run_number }}'
        assignees: '${{ github.actor }}'
        branch: prettier-auto-fix
        delete-branch: true
        title: 'Fix Prettier formatting from GitHub Actions run ${{ github.run_number }}'
        body: |
          Attempt to automatically fix Prettier formatting issues in ${{ github.sha }}.

          This PR is generated by GitHub Actions [run ${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). Please choose **Squash and Merge** for this PR.
    # job 此时已经因上一步失败而失败，这里只是把原因显式标出来，
    # 让 PR / 分支构建的失败信息直接指向 "请先跑 npm run fix"。
    - name: Fail on prettier check failure outside master
      if: "failure() && steps.prettier.outcome == 'failure' && github.event_name != 'push'"
      run: |
        echo "::error::Prettier 格式检查未通过，请先运行 'npm run fix' 并提交格式化结果。"
        exit 1

    - name: Run Jekyll Doctor
      run: |
        bundle exec jekyll doctor --trace --profile
      env:
        JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build site
      run: |
        bundle exec jekyll build --trace --profile
      env:
        JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Deploy to gh-pages
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      run: |
        set -euo pipefail

        git config --global user.name 'github-actions[bot]'
        git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'

        REMOTE="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"

        # 构建产物在 _site；gh-pages 的工作副本单独放在 _deploy，两者互不干扰。
        rm -rf _deploy
        if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
          echo "gh-pages 已存在，基于远端最新状态增量部署"
          git clone --depth=1 --branch=gh-pages --single-branch "$REMOTE" _deploy
        else
          echo "gh-pages 不存在，创建全新的空分支"
          mkdir -p _deploy
          git -C _deploy init --initial-branch=gh-pages
          git -C _deploy remote add origin "$REMOTE"
        fi

        # 用构建产物完全替换工作副本（保留 .git 以便提交），
        # 先清空再用 cp -a 覆盖，避免残留上一版已删除的页面。
        find _deploy -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
        cp -a _site/. _deploy/

        # .nojekyll 让 GitHub Pages 跳过 Jekyll 处理，直接发布构建产物。
        : > _deploy/.nojekyll
        # 自定义域名每次部署都写回，避免被覆盖后丢失。
        printf 'cips.nyist.edu.cn' > _deploy/CNAME

        cd _deploy
        git add -A
        if git diff --cached --quiet; then
          echo "站点内容没有变化，跳过提交"
          exit 0
        fi
        CINFO="$(git -C "$GITHUB_WORKSPACE" log -1 --pretty='%an: [%h] %s')"
        git commit \
          -m "Auto deploy from GitHub Actions build ${GITHUB_RUN_NUMBER}" \
          -m "$CINFO"
        git push origin gh-pages

    - name: Send end notification to WeCom
      if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master' && env.WECHAT_WORK_BOT_WEBHOOK != ''
      # 固定到 1.0.8 tag 对应的 commit，不再跟随浮动的 @master。
      uses: chf007/action-wechat-work@07415b74999c3220d36b54c14f5ee4a3fd43f582
      with:
        msgtype: text
        content: |
          NYIST/website 构建${{ job.status == 'success' && '成功，请前往服务器部署🚀' || '失败，请检查 Actions 日志⚠️' }}
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
